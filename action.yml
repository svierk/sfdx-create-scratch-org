name: SFDX Create Scratch Org
description: Composite action for creating a Salesforce scratch org.

branding:
  icon: cloud-lightning
  color: blue

inputs:
  alias:
    description: Alias for the scratch org.
    required: false
  set-default:
    description: Set the scratch org as your default org.
    required: false
  definition-file:
    description: >
      Path to a scratch org definition file.
      The scratch org definition file is a blueprint for the scratch org.
      It mimics the shape of an org that you use in the development life cycle, such as acceptance testing, packaging, or production.
      See <https://developer.salesforce.com/docs/atlas.en-us.sfdx_dev.meta/sfdx_dev/sfdx_dev_scratch_orgs_def_file.htm> for all the option you can specify in the definition file.
    required: false
  target-dev-hub:
    description: >
      Username or alias of the Dev Hub org.
      Overrides the value of the target-dev-hub configuration variable, if set.
    required: true
  edition:
    description: >
      Salesforce edition of the scratch org. Overrides the value of the "edition" option in the definition file, if set.
      The editions that begin with "partner-" are available only if the Dev Hub org is a Partner Business Org.
      Permissible values are: developer, enterprise, group, professional, partner-developer, partner-enterprise, partner-group, partner-professional
    required: false
  duration-days:
    description: Number of days before the org expires. (1-30)
    required: false
  wait:
    description: >
      Number of minutes to wait for the scratch org to be ready.
      If the command continues to run after the wait period, the CLI returns control of the terminal to you and displays the job ID.
      To resume the scratch org creation, run the org resume scratch command and pass it the job ID.
    required: false
  api-version:
    description: Override the api version used for api requests made by this command.
    required: false
  client-id:
    description: Consumer key of the Dev Hub connected app.
    required: false
  username:
    description: >
      Username of the scratch org admin user. Overrides the value of the "username" option in the definition file, if set.
      The username must be unique within the entire scratch org and sandbox universe. You must add your own logic to ensure uniqueness.
      Omit this flag to have Salesforce generate a unique username for your org.
    required: false
  description:
    description: >
      Description of the scratch org in the Dev Hub.
      Overrides the value of the "description" option in the definition file, if set.
    required: false
  name:
    description: >
      Name of the org, such as "Acme Company".
      Overrides the value of the "orgName" option in the definition file, if set.
    required: false
  release:
    description: >
      Release of the scratch org as compared to the Dev Hub release.
      By default, scratch orgs are on the same release as the Dev Hub.
      During Salesforce release transition periods, you can override this default behavior and opt in or out of the new release.
    required: false
  admin-email:
    description: >
      Email address that will be applied to the org's admin user.
      Overrides the value of the "adminEmail" option in the definition file, if set.
    required: false
  source-org:
    description: >
      15-character ID of the org whose shape the new scratch org will be based on.
      Overrides the value of the "sourceOrg" option in the definition file, if set.
    required: false
  generate-password:
    description: >
      Generate a password for the scratch org admin user after the org is created.
      The password is masked in the job log, but exposed in clear text via the job summary and the "password" output.
      Scratch orgs are ephemeral, but be aware that anyone with access to the workflow run can read the job summary.
    required: false
    default: 'false'
  step-summary:
    description: Write a result section to the GitHub Actions job summary. Set to false to avoid collisions with a custom workflow summary.
    required: false
    default: 'true'

outputs:
  username:
    description: Username of the created scratch org.
    value: ${{ steps.create.outputs.username }}
  org-id:
    description: ID of the created scratch org.
    value: ${{ steps.create.outputs.org-id }}
  password:
    description: Password of the scratch org admin user. Only set when generate-password is true.
    value: ${{ steps.password.outputs.password }}

runs:
  using: composite
  steps:
    - name: Create Scratch Org
      id: create
      shell: bash
      env:
        ALIAS: ${{ inputs.alias }}
        SET_DEFAULT: ${{ inputs.set-default }}
        DEFINITION_FILE: ${{ inputs.definition-file }}
        TARGET_DEV_HUB: ${{ inputs.target-dev-hub }}
        EDITION: ${{ inputs.edition }}
        DURATION_DAYS: ${{ inputs.duration-days }}
        WAIT: ${{ inputs.wait }}
        API_VERSION: ${{ inputs.api-version }}
        CLIENT_ID: ${{ inputs.client-id }}
        USERNAME: ${{ inputs.username }}
        DESCRIPTION: ${{ inputs.description }}
        NAME: ${{ inputs.name }}
        RELEASE: ${{ inputs.release }}
        ADMIN_EMAIL: ${{ inputs.admin-email }}
        SOURCE_ORG: ${{ inputs.source-org }}
        STEP_SUMMARY: ${{ inputs.step-summary }}
      run: |
        set -euo pipefail

        args=()

        if [[ -n "$ALIAS" ]]; then
          args+=(--alias "$ALIAS")
        fi

        if [[ "$SET_DEFAULT" == "true" ]]; then
          args+=(--set-default)
        fi

        if [[ -n "$DEFINITION_FILE" ]]; then
          args+=(--definition-file "$DEFINITION_FILE")
        fi

        if [[ -n "$TARGET_DEV_HUB" ]]; then
          args+=(--target-dev-hub "$TARGET_DEV_HUB")
        fi

        if [[ -n "$EDITION" ]]; then
          args+=(--edition "$EDITION")
        fi

        if [[ -n "$DURATION_DAYS" ]]; then
          args+=(--duration-days "$DURATION_DAYS")
        fi

        if [[ -n "$WAIT" ]]; then
          args+=(--wait "$WAIT")
        fi

        if [[ -n "$API_VERSION" ]]; then
          args+=(--api-version "$API_VERSION")
        fi

        if [[ -n "$CLIENT_ID" ]]; then
          args+=(--client-id "$CLIENT_ID")
        fi

        if [[ -n "$USERNAME" ]]; then
          args+=(--username "$USERNAME")
        fi

        if [[ -n "$DESCRIPTION" ]]; then
          args+=(--description "$DESCRIPTION")
        fi

        if [[ -n "$NAME" ]]; then
          args+=(--name "$NAME")
        fi

        if [[ -n "$RELEASE" ]]; then
          args+=(--release "$RELEASE")
        fi

        if [[ -n "$ADMIN_EMAIL" ]]; then
          args+=(--admin-email "$ADMIN_EMAIL")
        fi

        if [[ -n "$SOURCE_ORG" ]]; then
          args+=(--source-org "$SOURCE_ORG")
        fi

        # Capture the exit code instead of letting errexit end the step here: the
        # CLI explains why the org could not be created (e.g. the Dev Hub's limit
        # of active scratch orgs) only in the --json payload. An error payload
        # carries no credentials, so it is safe to print.
        result=$(sf org create scratch --json "${args[@]}") && exit_code=0 || exit_code=$?

        if [[ "$exit_code" -ne 0 ]]; then
          name=$(echo "$result" | jq -r '.name // empty' 2>/dev/null || true)
          message=$(echo "$result" | jq -r '.message // empty' 2>/dev/null || true)
          if [[ -n "$message" ]]; then
            echo "::error::Failed to create the scratch org${name:+ ($name)}: $message"
            echo "$result" | jq -r '.actions[]? | "  - \(.)"' 2>/dev/null || true
          else
            echo "$result"
            echo "::error::Failed to create the scratch org (exit code $exit_code)."
          fi
          exit "$exit_code"
        fi

        # The --json payload carries live credentials of the new org (access token,
        # refresh token, client secret). Register them as secrets before anything is
        # written to the log, so neither the dump below nor a later step can leak them.
        while IFS= read -r secret; do
          echo "::add-mask::$secret"
        done < <(echo "$result" | jq -r '(.result.authFields // {}) | (.accessToken // empty), (.refreshToken // empty), (.clientSecret // empty)')

        echo "$result" | jq '.'

        username=$(echo "$result" | jq -r '.result.username')
        org_id=$(echo "$result" | jq -r '.result.orgId')

        {
          echo "username=$username"
          echo "org-id=$org_id"
        } >> "$GITHUB_OUTPUT"

        echo "✅ Successfully created scratch org: $username"

        if [[ "$STEP_SUMMARY" == "true" ]]; then
          {
            echo ""
            echo "### 🌩️ Scratch org created"
            echo ""
            echo "- **Username:** \`$username\`"
            echo "- **Org ID:** \`$org_id\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Generate Password
      id: password
      if: ${{ inputs.generate-password == 'true' }}
      shell: bash
      env:
        USERNAME: ${{ steps.create.outputs.username }}
        STEP_SUMMARY: ${{ inputs.step-summary }}
      run: |
        set -euo pipefail

        result=$(sf org generate password --target-org "$USERNAME" --json)
        password=$(echo "$result" | jq -r '.result.password')

        # Keep the password out of the plain build log: mask it before the raw
        # command output is dumped. The job summary below is not masked - that is
        # the deliberate hand-over channel, see the input description.
        echo "::add-mask::$password"

        echo "$result" | jq '.'

        echo "password=$password" >> "$GITHUB_OUTPUT"

        echo "🔑 Generated password for $USERNAME"

        if [[ "$STEP_SUMMARY" == "true" ]]; then
          {
            echo "### 🔑 Scratch org password"
            echo ""
            echo "- **Password:** \`$password\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        fi
